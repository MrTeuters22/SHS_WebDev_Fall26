    <!DOCTYPE html>

<html>

<head>

    <title>HTML Forms</title>

</head>

<body>


    <h1>My Form</h1>


    <label for="name">Name: Max Hurney</label>

    <input id="name" type="text">


    <br><br>


    <p>Choose your favorite music:</p>


    <input id="rap" type="radio" name="music" value="rap">

    <label for="rap">Rap</label>


    <br>


    <input id="country" type="radio" name="music" value="country">

    <label for="country">Country</label>


    <br><br>


    <input id="music" type="checkbox">

    <label for="music">I like music</label>


    <br><br>


    <input type="button" value="Click Me">


    <br><br>


    <input type="submit" value="Submit">


</body>

</html>
