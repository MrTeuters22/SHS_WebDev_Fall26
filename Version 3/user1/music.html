
<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Music for Web Dev</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.css">

    <style>
        body {
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }

        h1, h2 {
            text-align: center;
            margin: 25px;
        }

        table {
            width: 90%;
            margin: auto;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid black;
            padding: 15px;
            text-align: center;
        }

        th {
            background-color: #222;
            color: white;
        }

        img {
            width: 130px;
            height: 130px;
            object-fit: contain;
        }

        footer {
            text-align: center;
            margin: 30px;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-md navbar-dark bg-dark">
        <div class="container-fluid">
            <a href="index.html" class="navbar-brand">WebDev</a>

            <ul class="navbar-nav">
                <li class="nav-item">
                    <a href="index.html" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="music.html" class="nav-link active">Music</a>
                </li>
            </ul>
        </div>
    </nav>

    <main class="container-fluid">

        <h1>My Music Page</h1>

        <h2>My Top 5 Favorite Songs</h2>

        <table id="songs">

            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Artist</th>
                    <th>Song</th>
                    <th>Album Art</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td>1</td>
                    <td>Rush</td>
                    <td>Fly By Night</td>
                    <td>
                        <img src="images/fly_by_night.jpg"
                             alt="Rush Fly By Night album cover">
                    </td>
                </tr>

                <tr>
                    <td>2</td>
                    <td>Barenaked Ladies</td>
                    <td>One Week</td>
                    <td>
                        <img src="images/bnl.jpg"
                             alt="Barenaked Ladies album cover">
                    </td>
                </tr>

                <tr>
                    <td>3</td>
                    <td>Dave Matthews Band</td>
                    <td>Grey Street</td>
                    <td>
                        <img src="images/grey_street.jpg"
                             alt="Dave Matthews Band album cover">
                    </td>
                </tr>

                <tr>
                    <td>4</td>
                    <td>Modest Mouse</td>
                    <td>One Chance</td>
                    <td>
                        <img src="images/modest_mouse.jpg"
                             alt="Modest Mouse album cover">
                    </td>
                </tr>

                <tr>
                    <td>5</td>
                    <td>New Radicals</td>
                    <td>Someday We'll Know</td>
                    <td>
                        <img src="https://upload.wikimedia.org/wikipedia/en/9/9c/Maybe_You%27ve_Been_Brainwashed_Too.jpg"
                             alt="New Radicals Maybe You've Been Brainwashed Too album cover">
                    </td>
                </tr>

            </tbody>
        </table>

    </main>

    <footer>
        Music can be found here:
        <a href="https://music.amazon.com">Amazon Music</a>
    </footer>

</body>
</html>
