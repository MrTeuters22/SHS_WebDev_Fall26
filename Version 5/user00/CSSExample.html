<!DOCTYPE html>
<html lang="en">
    <head>
        <style>
            h1 {
                color: red;
            }
            h3 {
                color: blue;
            }
            h6 {
                color: green;
            }
            table,th,td {
                color: rgb(1, 75, 0);
                border: 2px dashed black;
            }
        </style>
    </head>
    <body>
        <h1>This is a size one header!</h1>
        <p>Here is some sample text with a <a href="https://www.google.com/">link</a> to Google.</p>
        <h6>This is a size six header!</h6>
        <p> The following was created using a list:</p>
        <ul>
            <li>fish</li>
            <li>bird</li>
            <li>cat</li>
            <li>dog</li>
        </ul>
        <h3>This is a size three header!</h3>
        <table>
            <tr>
                <th>Col 1</th>
                <th>Col 2</th>
            </tr>
            <tr>
                <td>One</td>
                <td>Two</td>
            </tr>
            <tr>
                <td>Three</td>
                <td>Four</td>
            </tr>
        </table>
    </body>
</html>
